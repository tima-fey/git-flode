- id: climate_enforce_antifreeze_lock
  alias: Climate enforce antifreeze lock
  trigger:
  - platform: homeassistant
    event: start
  - platform: state
    entity_id:
    - input_boolean.summer
    - input_select.presence
    - input_select.heating_mode
  condition:
  - condition: or
    conditions:
    - condition: state
      entity_id: input_boolean.summer
      state: 'on'
    - condition: state
      entity_id: input_select.presence
      state: Vacation
  - condition: not
    conditions:
    - condition: state
      entity_id: input_select.heating_mode
      state: Antifreeze
  action:
  - service: input_select.select_option
    data:
      option: Antifreeze
    target:
      entity_id: input_select.heating_mode
  mode: single
- id: climate_schedule_heating_mode
  alias: Climate schedule heating mode
  trigger:
  - platform: homeassistant
    event: start
  - platform: time
    at: '06:30:00'
  - platform: time
    at: '08:00:00'
  - platform: time
    at: '21:30:00'
  - platform: time
    at: '00:00:00'
  - platform: state
    entity_id:
    - input_boolean.summer
    to: 'off'
  - platform: state
    entity_id:
    - input_select.presence
    from: Vacation
  condition:
  - condition: state
    entity_id: input_boolean.summer
    state: 'off'
  - condition: not
    conditions:
    - condition: state
      entity_id: input_select.presence
      state: Vacation
  action:
  - choose:
    - conditions:
      - condition: time
        after: '06:30:00'
        before: '08:00:00'
      sequence:
      - service: input_select.select_option
        data:
          option: Morning
        target:
          entity_id: input_select.heating_mode
    - conditions:
      - condition: time
        after: '08:00:00'
        before: '21:30:00'
      sequence:
      - service: input_select.select_option
        data:
          option: Day
        target:
          entity_id: input_select.heating_mode
    - conditions:
      - condition: time
        after: '21:30:00'
        before: '00:00:00'
      sequence:
      - service: input_select.select_option
        data:
          option: Evening
        target:
          entity_id: input_select.heating_mode
    default:
    - service: input_select.select_option
      data:
        option: Night
      target:
        entity_id: input_select.heating_mode
  mode: single
- id: climate_apply_mode_targets
  alias: Climate apply mode targets
  trigger:
  - platform: homeassistant
    event: start
  - platform: state
    entity_id:
    - input_select.heating_mode
  condition: []
  action:
  - choose:
    - conditions:
      - condition: state
        entity_id: input_select.heating_mode
        state: Morning
      sequence:
      - service: input_number.set_value
        data:
          value: 20
        target:
          entity_id: input_number.bathroom_target_temperature
      - service: input_number.set_value
        data:
          value: 20
        target:
          entity_id: input_number.bedroom_target_temperature
      - service: input_number.set_value
        data:
          value: 16
        target:
          entity_id: input_number.livingroom_target_temperature
    - conditions:
      - condition: state
        entity_id: input_select.heating_mode
        state: Day
      sequence:
      - service: input_number.set_value
        data:
          value: 10
        target:
          entity_id: input_number.bathroom_target_temperature
      - service: input_number.set_value
        data:
          value: 16
        target:
          entity_id: input_number.bedroom_target_temperature
      - service: input_number.set_value
        data:
          value: 17
        target:
          entity_id: input_number.livingroom_target_temperature
    - conditions:
      - condition: state
        entity_id: input_select.heating_mode
        state: Evening
      sequence:
      - service: input_number.set_value
        data:
          value: 20
        target:
          entity_id: input_number.bathroom_target_temperature
      - service: input_number.set_value
        data:
          value: 22
        target:
          entity_id: input_number.bedroom_target_temperature
      - service: input_number.set_value
        data:
          value: 19
        target:
          entity_id: input_number.livingroom_target_temperature
    - conditions:
      - condition: state
        entity_id: input_select.heating_mode
        state: Night
      sequence:
      - service: input_number.set_value
        data:
          value: 10
        target:
          entity_id: input_number.bathroom_target_temperature
      - service: input_number.set_value
        data:
          value: 20
        target:
          entity_id: input_number.bedroom_target_temperature
      - service: input_number.set_value
        data:
          value: 18
        target:
          entity_id: input_number.livingroom_target_temperature
    - conditions:
      - condition: state
        entity_id: input_select.heating_mode
        state: Antifreeze
      sequence:
      - service: input_number.set_value
        data:
          value: 10
        target:
          entity_id:
          - input_number.bathroom_target_temperature
          - input_number.bedroom_target_temperature
          - input_number.livingroom_target_temperature
    - conditions:
      - condition: state
        entity_id: input_select.heating_mode
        state: Extra Heat
      sequence:
      - service: input_number.set_value
        data:
          value: 21
        target:
          entity_id: input_number.bathroom_target_temperature
      - service: input_number.set_value
        data:
          value: 22
        target:
          entity_id: input_number.bedroom_target_temperature
      - service: input_number.set_value
        data:
          value: 20
        target:
          entity_id: input_number.livingroom_target_temperature
  mode: single
- id: climate_sync_target_temperatures
  alias: Climate sync target temperatures
  description: Sync all three room targets on every trigger without changing HVAC modes, then update main heating.
  trigger:
  - platform: homeassistant
    event: start
  - platform: time_pattern
    minutes: '0'
    seconds: '0'
    hours: '*'
  - platform: state
    entity_id:
    - input_number.bedroom_target_temperature
    - input_number.bathroom_target_temperature
    - input_number.livingroom_target_temperature
  condition: []
  action:
  - service: climate.set_temperature
    data:
      temperature: '{{ states(''input_number.bedroom_target_temperature'') | float }}'
    target:
      entity_id: climate.bedroom_thermostat
  - service: climate.set_temperature
    data:
      temperature: '{{ states(''input_number.bathroom_target_temperature'') | float }}'
    target:
      area_id: bathroom
  - service: climate.set_temperature
    data:
      temperature: '{{ states(''input_number.livingroom_target_temperature'') | float }}'
    target:
      entity_id:
      - climate.ground_floor_thermostat_1
      - climate.ground_floor_thermostat_2
      - climate.ground_floor_thermostat_3
  - service: automation.trigger
    data:
      skip_condition: true
    target:
      entity_id: automation.climate_main_heating
  mode: queued
- id: climate_main_heating
  alias: Climate main heating
  trigger:
  - platform: time_pattern
    hours: '*'
    minutes: '/10'
  - platform: template
    value_template: >-
      {{ is_state_attr('climate.bedroom_thermostat', 'hvac_action', 'heating')
        or is_state_attr('climate.bathroom_thermostat', 'hvac_action', 'heating')
        or is_state_attr('climate.mens_cave_thermostat', 'hvac_action', 'heating')
        or is_state_attr('climate.garage_thermostat', 'hvac_action', 'heating')
        or is_state_attr('climate.womens_cave_thermostat', 'hvac_action', 'heating') }}
  - platform: template
    value_template: >-
      {{ not (
        is_state_attr('climate.bedroom_thermostat', 'hvac_action', 'heating')
        or is_state_attr('climate.bathroom_thermostat', 'hvac_action', 'heating')
        or is_state_attr('climate.mens_cave_thermostat', 'hvac_action', 'heating')
        or is_state_attr('climate.garage_thermostat', 'hvac_action', 'heating')
        or is_state_attr('climate.womens_cave_thermostat', 'hvac_action', 'heating')
      ) }}
  condition: []
  action:
  - choose:
    - conditions:
      - condition: template
        value_template: >-
          {{ is_state_attr('climate.bedroom_thermostat', 'hvac_action', 'heating')
            or is_state_attr('climate.bathroom_thermostat', 'hvac_action', 'heating')
            or is_state_attr('climate.mens_cave_thermostat', 'hvac_action', 'heating')
            or is_state_attr('climate.garage_thermostat', 'hvac_action', 'heating')
            or is_state_attr('climate.womens_cave_thermostat', 'hvac_action', 'heating') }}
      sequence:
      - service: climate.set_temperature
        data:
          hvac_mode: heat
          temperature: 21
        target:
          entity_id: climate.main_thermostat
    default:
    - service: climate.turn_off
      target:
        entity_id: climate.main_thermostat
  mode: single
